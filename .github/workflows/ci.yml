name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seats
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  container:
    name: Clean build and boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same command a reviewer runs on a fresh clone, with no .env present.
      - name: Build and start the stack
        run: docker compose up --build -d --wait
      - name: Readiness and a smoke request
        run: |
          curl -fsS localhost:8000/readyz
          curl -fsS -X POST localhost:8000/auth/token \
            -H 'content-type: application/json' -d '{"user_id":"ci"}' > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs
