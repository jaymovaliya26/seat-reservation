[project]
name = "seat-reservation"
version = "0.3.0"
description = "Seat reservation API that sells each seat exactly once under heavy concurrency"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "gunicorn>=26.2.0",
    "orjson>=3.12.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "structlog>=26.1.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
