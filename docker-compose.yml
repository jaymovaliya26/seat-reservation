services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seats
    ports:
      - "5433:5432" # 5433 on the host, so it never clashes with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seats"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18+ images keep data under /var/lib/postgresql/18

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/seats
      # Taken from .env when present; the fallbacks let a fresh clone run with no setup.
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-dev-admin-key}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_MAX: ${DB_POOL_MAX:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
