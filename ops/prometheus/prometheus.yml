# Local Prometheus for watching a burst: docker compose --profile observability up -d
# then open http://localhost:9090.
global:
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: seat-reservation
    static_configs:
      - targets: ["app:8000"]
